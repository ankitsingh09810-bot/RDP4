Name: Phoenix V100 (Telegram Bot Control)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      matrix:
        machine-id: [1]
      fail-fast: false

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright requests python-telegram-bot
        playwright install chromium

    - name: 🔥 Run Phoenix Engine (Telegram Bot)
      env:
        PYTHONIOENCODING: utf-8
        MACHINE_INDEX: ${{ matrix.machine-id }}
      run: |
        # STAGGERED START: Spacing out machines to reduce detection risk
        DELAY=$(( (MACHINE_INDEX - 1) * 15 ))
        echo "⏳ Machine #${MACHINE_INDEX} waiting ${DELAY}s for staggered startup..."
        sleep $DELAY

        while true; do
          echo "🚀 Starting Telegram Bot Controller on Machine #${MACHINE_INDEX}..."
          
          # Using -u for real-time unbuffered log output
          if python -u main.py; then
            echo "✅ Script finished naturally. Restarting..."
          else
            echo "❌ Engine Crash Detected. Respawning in 10s..."
          fi
          
          sleep 10
        done
        
